[project]
name = "numinous"
version = "0.1.11"
description = "Python SDK for Numinous Cloud sandboxes"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]

[project.scripts]
numinous = "numinous.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["numinous"]
